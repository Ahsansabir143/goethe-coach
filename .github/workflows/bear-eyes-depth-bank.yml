name: Real order-book archive
on:
  schedule:
    - cron: "17 3 * * *"   # daily, after Binance publishes yesterday's files
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python bear-eyes/tools/build_depth_bank.py
      - name: Commit new data
        run: |
          git config user.name "bear-eyes-bot"
          git config user.email "bear-eyes-bot@users.noreply.github.com"
          git add bear-eyes/data/depth
          git diff --cached --quiet || (git commit -m "Update real order-book archive" && git push)
